<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slider</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mqc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>

  <div class="pi-hint mqc-help" data-i18n="pi.slider_help"></div>

  <mqc-device action="slider"></mqc-device>

  <pi-section title="pi.device">
    <mqc-topic setting="stateTopic" label="pi.state_topic" placeholder="pi.topic_search_placeholder" hint="pi.slider_topic_hint"></mqc-topic>
    <mqc-json-field setting="field" topic-setting="stateTopic" label="pi.field"></mqc-json-field>
    <mqc-topic no-explore setting="commandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder" hint="pi.command_topic_hint"></mqc-topic>
    <pi-field setting="template" label="pi.template" placeholder='{"brightness":{value}}' hint="pi.slider_template_hint"></pi-field>
    <pi-field setting="min" label="pi.min" placeholder="0"></pi-field>
    <pi-field setting="max" label="pi.max" placeholder="100"></pi-field>
    <pi-field setting="step" label="pi.step" placeholder="1" hint="pi.step_hint"></pi-field>
    <pi-field setting="unit" label="pi.unit" placeholder="pi.unit_placeholder"></pi-field>
    <pi-toggle setting="percent" label="pi.percent" hint="pi.percent_hint"></pi-toggle>
  </pi-section>

  <pi-section title="pi.actual">
    <mqc-topic setting="actualTopic" label="pi.actual_topic" placeholder="pi.topic_search_placeholder" hint="pi.actual_hint"></mqc-topic>
    <mqc-json-field setting="actualField" topic-setting="actualTopic" label="pi.field"></mqc-json-field>
  </pi-section>

  <pi-section title="pi.display">
    <pi-choice setting="look" default="half" columns="2" data-options='[
      {"value":"half","label":"pi.look_gauge","icon":"gauge"},
      {"value":"ring","label":"pi.look_ring","icon":"ring"}
    ]'></pi-choice>
    <pi-field setting="label" label="pi.label" placeholder="pi.label_placeholder"></pi-field>
    <pi-field setting="decimals" label="pi.decimals" placeholder="pi.decimals_auto"></pi-field>
    <pi-icon-picker setting="icon" none-label="pi.icon" reset-label="kit.threshold_remove"></pi-icon-picker>
  </pi-section>

  <pi-section title="pi.colors">
    <pi-thresholds setting="thresholds" base-setting="color" base-default="#F7A600" unit-setting="unit" min-setting="min" max-setting="max" default-min="0" default-max="100"></pi-thresholds>
  </pi-section>

  <pi-section title="pi.on_push">
    <pi-choice setting="pressAction" default="none" columns="3" data-options='[
      {"value":"none","label":"pi.press_none","icon":"none"},
      {"value":"toggle","label":"pi.press_toggle","icon":"toggle"},
      {"value":"send","label":"pi.press_send","icon":"send"}
    ]'></pi-choice>
    <div data-show-when="pressAction=toggle" data-show-default="none">
      <mqc-topic setting="pressStateTopic" suggest suggest-prefix="press" label="pi.press_state_topic" placeholder="pi.topic_search_placeholder" hint="pi.push_state_topic_hint"></mqc-topic>
      <mqc-json-field setting="pressField" topic-setting="pressStateTopic" label="pi.field"></mqc-json-field>
      <mqc-topic no-explore setting="pressCommandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder"></mqc-topic>
      <pi-field setting="pressOnValue" label="pi.on_value" placeholder="pi.auto_value"></pi-field>
      <pi-field setting="pressOffValue" label="pi.off_value" placeholder="pi.auto_value" hint="pi.auto_value_hint"></pi-field>
      <pi-field setting="pressTemplate" label="pi.template" placeholder='{"state":"{value}"}'></pi-field>
      <mqc-test prefix="press"></mqc-test>
    </div>
    <div data-show-when="pressAction=send" data-show-default="none">
      <mqc-topic setting="sendTopic" label="pi.send_topic" placeholder="pi.topic_search_placeholder"></mqc-topic>
      <pi-field setting="sendPayload" label="pi.send_payload" placeholder="pi.send_payload_placeholder" hint="pi.send_payload_hint"></pi-field>
    </div>
  </pi-section>

  <pi-section title="pi.advanced">
    <mqc-topic no-explore setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></mqc-topic>
    <pi-toggle setting="retain" label="pi.retain" hint="pi.retain_hint"></pi-toggle>
  </pi-section>

  <mqc-connection-card></mqc-connection-card>

  <div class="pi-footer"><span data-plugin-version>MQ-C</span></div>
</body>

</html>
