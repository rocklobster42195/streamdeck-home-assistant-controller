<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="hac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden data-title="Switch">
  <div class="pi-hint hac-help" data-i18n="pi.switch_help"></div>

  <hac-device data-window-section="pi.pick_device" action="switch"></hac-device>

  <pi-section class="pi-win" title="pi.mqtt_topics" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic setting="stateTopic" suggest label="pi.state_topic" placeholder="pi.topic_search_placeholder" hint="pi.state_topic_hint"></hac-topic>
    <hac-json-field setting="field" topic-setting="stateTopic" label="pi.field"></hac-json-field>
    <pi-field setting="onValue" label="pi.on_value" placeholder="pi.auto_value"></pi-field>
    <pi-field setting="offValue" label="pi.off_value" placeholder="pi.auto_value" hint="pi.auto_value_hint"></pi-field>
    <hac-test></hac-test>
  </pi-section>

  <pi-section title="pi.display">
    <pi-field setting="label" label="pi.label" placeholder="pi.label_placeholder"></pi-field>
    <pi-toggle setting="hideLabel" label="pi.hide_label"></pi-toggle>
    <pi-color setting="colorOn" default="#F7A600" label="pi.color_on"></pi-color>
    <pi-toggle class="pi-win" setting="colorCaption" label="pi.color_caption" hint="pi.color_caption_hint"></pi-toggle>
  </pi-section>

  <pi-section class="pi-win" title="pi.icons">
    <pi-icon-picker setting="iconOn" default-icon="mdiLightbulbOnOutline" hint="pi.icon_on"></pi-icon-picker>
    <pi-icon-picker setting="iconOff" default-icon="mdiLightbulbOutline" hint="pi.icon_off"></pi-icon-picker>
  </pi-section>

  <pi-section class="pi-win" title="pi.value_line">
    <div data-show-when="source=ha" data-show-default="mqtt">
      <hac-ha-entity setting="valueEntityId" label="pi.entity" placeholder="pi.same_entity"></hac-ha-entity>
      <hac-ha-attribute setting="valueAttribute" entity-setting="valueEntityId" fallback-setting="entityId" hint="pi.value_line_ha_hint"></hac-ha-attribute>
    </div>
    <div data-show-when="source=mqtt" data-show-default="mqtt">
      <hac-topic setting="valueTopic" label="pi.value_topic" placeholder="pi.topic_search_placeholder" hint="pi.value_line_hint"></hac-topic>
      <hac-json-field setting="valueField" topic-setting="valueTopic" label="pi.field"></hac-json-field>
    </div>
    <pi-field setting="valueUnit" label="pi.unit" placeholder="pi.unit_placeholder"></pi-field>
    <pi-field setting="valueDecimals" label="pi.decimals" placeholder="pi.decimals_placeholder"></pi-field>
  </pi-section>

  <pi-section class="pi-win" title="pi.value_colors">
    <div class="pi-hint hac-help" data-i18n="pi.value_colors_hint"></div>
    <pi-thresholds setting="valueThresholds" base-setting="colorOn" base-default="#F7A600" unit-setting="valueUnit" default-min="0" default-max="100"></pi-thresholds>
  </pi-section>

  <pi-section class="pi-win" title="pi.advanced" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic no-explore setting="commandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder" hint="pi.command_topic_hint"></hac-topic>
    <pi-field setting="template" label="pi.template" placeholder='{"state":"{value}"}' hint="pi.template_hint"></pi-field>
    <pi-field setting="commandOn" label="pi.command_on" placeholder="pi.same_as_state"></pi-field>
    <pi-field setting="commandOff" label="pi.command_off" placeholder="pi.same_as_state"></pi-field>
    <hac-topic no-explore setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></hac-topic>
    <pi-toggle setting="retain" label="pi.retain" hint="pi.retain_hint"></pi-toggle>
    <pi-choice setting="qos" default="0" columns="3" data-options='[
      {"value":"0","label":"QoS 0"},
      {"value":"1","label":"QoS 1"},
      {"value":"2","label":"QoS 2"}
    ]'></pi-choice>
  </pi-section>

  <pi-more ready-when="entityId,stateTopic,commandTopic" setup-hint="pi.set_up_hint"></pi-more>
  <hac-sources class="pi-pi-only"></hac-sources>

  <div id="connections" data-window-section="pi.connections" class="pi-win hac-connections">
    <hac-ha-card></hac-ha-card>
    <hac-connection-card></hac-connection-card>
    <hac-device-card></hac-device-card>
  </div>

  <div class="pi-footer"><span data-plugin-version>HA-C</span></div>
</body>

</html>
