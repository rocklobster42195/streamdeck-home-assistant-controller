<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-state</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="hac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <div class="pi-hint hac-help" data-i18n="pi.multi_help"></div>

  <hac-device action="multi-state"></hac-device>

  <pi-section title="pi.device">
    <hac-topic setting="stateTopic" label="pi.state_topic" placeholder="pi.topic_search_placeholder" hint="pi.multi_topic_hint"></hac-topic>
    <hac-json-field setting="field" topic-setting="stateTopic" label="pi.field"></hac-json-field>
  </pi-section>

  <pi-section title="pi.states">
    <hac-states setting="states" topic-setting="stateTopic" field-setting="field"></hac-states>
  </pi-section>

  <pi-section title="pi.display">
    <pi-field setting="label" label="pi.label" placeholder="pi.multi_label_placeholder"></pi-field>
  </pi-section>

  <pi-section title="pi.advanced">
    <hac-topic no-explore setting="commandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder" hint="pi.command_topic_hint"></hac-topic>
    <pi-field setting="template" label="pi.template" placeholder='{"fan_mode":"{value}"}' hint="pi.multi_template_hint"></pi-field>
    <hac-topic no-explore setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></hac-topic>
    <pi-toggle setting="retain" label="pi.retain" hint="pi.retain_hint"></pi-toggle>
    <pi-choice setting="qos" default="0" columns="3" data-options='[
      {"value":"0","label":"QoS 0"},
      {"value":"1","label":"QoS 1"},
      {"value":"2","label":"QoS 2"}
    ]'></pi-choice>
  </pi-section>

  <hac-connection-card></hac-connection-card>

  <div class="pi-footer"><span data-plugin-version>HA-C</span></div>
</body>

</html>
