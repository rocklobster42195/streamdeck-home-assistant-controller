<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mqc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <div class="pi-hint mqc-help" data-i18n="pi.switch_help"></div>

  <pi-section title="pi.device">
    <mqc-topic setting="stateTopic" suggest label="pi.state_topic" placeholder="pi.topic_search_placeholder" hint="pi.state_topic_hint"></mqc-topic>
    <mqc-json-field setting="field" topic-setting="stateTopic" label="pi.field"></mqc-json-field>
    <pi-field setting="onValue" label="pi.on_value" placeholder="ON"></pi-field>
    <pi-field setting="offValue" label="pi.off_value" placeholder="OFF"></pi-field>
  </pi-section>

  <pi-section title="pi.display">
    <pi-field setting="label" label="pi.label" placeholder="pi.label_placeholder"></pi-field>
    <pi-icon-picker setting="iconOn" default-icon="mdiLightbulbOnOutline" hint="pi.icon_on"></pi-icon-picker>
    <pi-icon-picker setting="iconOff" default-icon="mdiLightbulbOutline" hint="pi.icon_off"></pi-icon-picker>
    <pi-color setting="colorOn" default="#F7A600" label="pi.color_on"></pi-color>
  </pi-section>

  <pi-section title="pi.advanced">
    <mqc-topic setting="commandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder" hint="pi.command_topic_hint"></mqc-topic>
    <pi-field setting="template" label="pi.template" placeholder='{"state":"{value}"}' hint="pi.template_hint"></pi-field>
    <pi-field setting="commandOn" label="pi.command_on" placeholder="pi.same_as_state"></pi-field>
    <pi-field setting="commandOff" label="pi.command_off" placeholder="pi.same_as_state"></pi-field>
    <mqc-topic setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></mqc-topic>
    <pi-toggle setting="retain" label="pi.retain" hint="pi.retain_hint"></pi-toggle>
    <pi-choice setting="qos" default="0" columns="3" data-options='[
      {"value":"0","label":"QoS 0"},
      {"value":"1","label":"QoS 1"},
      {"value":"2","label":"QoS 2"}
    ]'></pi-choice>
  </pi-section>

  <mqc-connection-card></mqc-connection-card>

  <div class="pi-footer"><span data-plugin-version>MQ-C</span></div>
</body>

</html>
