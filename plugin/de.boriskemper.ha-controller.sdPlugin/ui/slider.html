<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slider</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="hac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden data-title="Slider">

  <div class="pi-hint hac-help" data-i18n="pi.slider_help"></div>

  <hac-device data-window-section="pi.pick_device" action="slider"></hac-device>

  <pi-section title="pi.value" data-show-when="source=ha" data-show-default="mqtt">
    <pi-field setting="step" label="pi.step" placeholder="pi.step_from_ha" hint="pi.slider_ha_hint"></pi-field>
    <pi-field setting="unit" label="pi.unit" placeholder="pi.unit_from_ha"></pi-field>
  </pi-section>

  <pi-section class="pi-win" title="pi.mqtt_topics" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic setting="stateTopic" label="pi.state_topic" placeholder="pi.topic_search_placeholder" hint="pi.slider_topic_hint"></hac-topic>
    <hac-json-field setting="field" topic-setting="stateTopic" label="pi.field"></hac-json-field>
    <hac-topic no-explore setting="commandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder" hint="pi.command_topic_hint"></hac-topic>
    <pi-field setting="template" label="pi.template" placeholder='{"brightness":{value}}' hint="pi.slider_template_hint"></pi-field>
    <pi-field setting="min" label="pi.min" placeholder="0"></pi-field>
    <pi-field setting="max" label="pi.max" placeholder="100"></pi-field>
    <pi-field setting="step" label="pi.step" placeholder="1" hint="pi.step_hint"></pi-field>
    <pi-field setting="unit" label="pi.unit" placeholder="pi.unit_placeholder"></pi-field>
    <pi-toggle setting="percent" label="pi.percent" hint="pi.percent_hint"></pi-toggle>
  </pi-section>

  <pi-section class="pi-win" title="pi.actual" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic setting="actualTopic" label="pi.actual_topic" placeholder="pi.topic_search_placeholder" hint="pi.actual_hint"></hac-topic>
    <hac-json-field setting="actualField" topic-setting="actualTopic" label="pi.field"></hac-json-field>
  </pi-section>

  <pi-section title="pi.display">
    <pi-choice setting="look" default="open" columns="4" data-options='[
      {"value":"open","label":"pi.look_open","icon":"open"},
      {"value":"half","label":"pi.look_gauge","icon":"gauge"},
      {"value":"ring","label":"pi.look_ring","icon":"ring"},
      {"value":"pie","label":"pi.look_pie","icon":"pie"}
    ]'></pi-choice>
    <pi-field setting="label" label="pi.label" placeholder="pi.label_placeholder"></pi-field>
    <pi-toggle setting="hideLabel" label="pi.hide_label"></pi-toggle>
    <pi-field setting="decimals" label="pi.decimals" placeholder="pi.decimals_auto"></pi-field>
  </pi-section>

  <pi-section class="pi-win" title="pi.icons">
    <pi-icon-picker setting="icon" none-label="pi.icon" reset-label="kit.threshold_remove"></pi-icon-picker>
  </pi-section>

  <pi-panorama class="pi-win"></pi-panorama>

  <pi-section class="pi-win" title="pi.background">
    <hac-ha-entity setting="effectColorEntityId" label="pi.effect_color" placeholder="pi.effect_color_placeholder"></hac-ha-entity>
    <hac-ha-attribute setting="effectColorAttribute" entity-setting="effectColorEntityId" hint="pi.effect_color_hint"></hac-ha-attribute>
    <hac-ha-entity setting="effectSpeedEntityId" label="pi.effect_speed" placeholder="pi.effect_number_placeholder"></hac-ha-entity>
    <div class="pi-pair">
      <pi-field setting="effectSpeedMin" label="pi.effect_min" placeholder="pi.effect_range_auto"></pi-field>
      <pi-field setting="effectSpeedMax" label="pi.effect_max" placeholder="pi.effect_range_auto"></pi-field>
    </div>
    <hac-ha-entity setting="effectDensityEntityId" label="pi.effect_density" placeholder="pi.effect_number_placeholder"></hac-ha-entity>
    <div class="pi-pair">
      <pi-field setting="effectDensityMin" label="pi.effect_min" placeholder="pi.effect_range_auto"></pi-field>
      <pi-field setting="effectDensityMax" label="pi.effect_max" placeholder="pi.effect_range_auto"></pi-field>
    </div>
    <div class="pi-hint pi-padded" data-i18n="pi.effect_number_hint"></div>
    <hac-ha-entity setting="effectLevelEntityId" label="pi.effect_level" placeholder="pi.effect_level_placeholder"></hac-ha-entity>
    <pi-field setting="effectLevelMax" label="pi.effect_level_max" placeholder="100" hint="pi.effect_level_hint"></pi-field>
  </pi-section>

  <pi-section class="pi-win" title="pi.colors">
    <pi-thresholds setting="thresholds" base-setting="color" base-default="#F7A600" unit-setting="unit" min-setting="min" max-setting="max" default-min="0" default-max="100"></pi-thresholds>
  </pi-section>

  <pi-section class="pi-win" title="pi.on_push" data-show-when="source=mqtt" data-show-default="mqtt">
    <pi-choice setting="pressAction" default="none" columns="3" data-options='[
      {"value":"none","label":"pi.press_none","icon":"none"},
      {"value":"toggle","label":"pi.press_toggle","icon":"toggle"},
      {"value":"send","label":"pi.press_send","icon":"send"}
    ]'></pi-choice>
    <div data-show-when="pressAction=toggle" data-show-default="none">
      <hac-topic setting="pressStateTopic" suggest suggest-prefix="press" label="pi.press_state_topic" placeholder="pi.topic_search_placeholder" hint="pi.push_state_topic_hint"></hac-topic>
      <hac-json-field setting="pressField" topic-setting="pressStateTopic" label="pi.field"></hac-json-field>
      <hac-topic no-explore setting="pressCommandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder"></hac-topic>
      <pi-field setting="pressOnValue" label="pi.on_value" placeholder="pi.auto_value"></pi-field>
      <pi-field setting="pressOffValue" label="pi.off_value" placeholder="pi.auto_value" hint="pi.auto_value_hint"></pi-field>
      <pi-field setting="pressTemplate" label="pi.template" placeholder='{"state":"{value}"}'></pi-field>
      <hac-test prefix="press"></hac-test>
    </div>
    <div data-show-when="pressAction=send" data-show-default="none">
      <hac-topic setting="sendTopic" label="pi.send_topic" placeholder="pi.topic_search_placeholder"></hac-topic>
      <pi-field setting="sendPayload" label="pi.send_payload" placeholder="pi.send_payload_placeholder" hint="pi.send_payload_hint"></pi-field>
    </div>
  </pi-section>

  <pi-section class="pi-win" title="pi.advanced" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic no-explore setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></hac-topic>
    <pi-toggle setting="retain" label="pi.retain" hint="pi.retain_hint"></pi-toggle>
  </pi-section>

  <pi-panorama class="pi-pi-only" summary></pi-panorama>

  <pi-more ready-when="entityId,stateTopic,commandTopic" setup-hint="pi.set_up_hint"></pi-more>
  <hac-sources class="pi-pi-only"></hac-sources>

  <div id="connections" data-window-section="pi.connections" class="pi-win hac-connections">
    <hac-ha-card></hac-ha-card>
    <hac-connection-card></hac-connection-card>
  </div>

  <div class="pi-footer"><span data-plugin-version>HA-C</span></div>
</body>

</html>
