<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Value</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="hac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden data-title="Value">
  <div class="pi-hint hac-help" data-i18n="pi.value_help"></div>

  <hac-device data-window-section="pi.pick_device" action="value"></hac-device>

  <pi-section class="pi-win" title="pi.mqtt_topics" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic setting="stateTopic" label="pi.state_topic" placeholder="pi.topic_search_placeholder" hint="pi.value_topic_hint"></hac-topic>
    <hac-json-field setting="field" topic-setting="stateTopic" label="pi.field"></hac-json-field>
    <pi-field setting="unit" label="pi.unit" placeholder="pi.unit_placeholder"></pi-field>
    <pi-field setting="decimals" label="pi.decimals" placeholder="pi.decimals_placeholder"></pi-field>
  </pi-section>

  <pi-section title="pi.value" data-show-when="source=ha" data-show-default="mqtt">
    <hac-ha-attribute setting="attribute" entity-setting="entityId" hint="pi.attribute_hint"></hac-ha-attribute>
    <pi-field setting="unit" label="pi.unit" placeholder="pi.unit_from_ha"></pi-field>
    <pi-field setting="decimals" label="pi.decimals" placeholder="pi.decimals_placeholder"></pi-field>
  </pi-section>

  <pi-section title="pi.display">
    <pi-choice setting="look" default="text" columns="3" data-options='[
      {"value":"text","label":"pi.look_text","icon":"text"},
      {"value":"gauge","label":"pi.look_gauge","icon":"gauge"},
      {"value":"open","label":"pi.look_open","icon":"open"}
    ]'></pi-choice>
    <pi-field setting="min" label="pi.min" placeholder="0" data-show-when="look=gauge,open" data-show-default="text"></pi-field>
    <pi-field setting="max" label="pi.max" placeholder="100" data-show-when="look=gauge,open" data-show-default="text"></pi-field>
    <pi-field setting="label" label="pi.label" placeholder="pi.label_placeholder"></pi-field>
    <pi-toggle setting="hideLabel" label="pi.hide_label"></pi-toggle>
  </pi-section>

  <pi-section class="pi-win" title="pi.icons">
    <pi-icon-picker setting="icon" none-label="pi.icon" reset-label="kit.threshold_remove"></pi-icon-picker>
  </pi-section>

  <pi-section class="pi-win" title="pi.second_line">
    <div data-show-when="source=ha" data-show-default="mqtt">
      <hac-ha-entity setting="secondEntityId" label="pi.entity" placeholder="pi.same_entity"></hac-ha-entity>
      <hac-ha-attribute setting="secondAttribute" entity-setting="secondEntityId" fallback-setting="entityId"></hac-ha-attribute>
    </div>
    <div data-show-when="source=mqtt" data-show-default="mqtt">
      <hac-topic setting="secondTopic" label="pi.second_topic" placeholder="pi.topic_search_placeholder"></hac-topic>
      <hac-json-field setting="secondField" topic-setting="secondTopic" label="pi.field"></hac-json-field>
    </div>
    <pi-field setting="secondUnit" label="pi.unit" placeholder="pi.unit_placeholder"></pi-field>
    <pi-field setting="secondDecimals" label="pi.decimals" placeholder="pi.decimals_placeholder" hint="pi.second_line_hint"></pi-field>
  </pi-section>

  <pi-section class="pi-win" title="pi.colors">
    <pi-thresholds setting="thresholds" base-setting="color" base-default="#FFFFFF" unit-setting="unit" min-setting="min" max-setting="max" default-min="0" default-max="100"></pi-thresholds>
  </pi-section>

  <pi-section class="pi-win" title="pi.on_press">
    <pi-choice setting="pressAction" default="none" columns="3" data-options='[
      {"value":"none","label":"pi.press_none","icon":"none"},
      {"value":"toggle","label":"pi.press_toggle","icon":"toggle"},
      {"value":"send","label":"pi.press_send","icon":"send"}
    ]'></pi-choice>
    <div data-show-when="pressAction=toggle,send" data-show-default="none">
      <div data-show-when="source=ha" data-show-default="mqtt">
        <hac-ha-entity setting="pressEntityId" label="pi.press_entity" placeholder="pi.press_entity_placeholder" hint="pi.press_entity_hint"></hac-ha-entity>
      </div>
    </div>
    <div data-show-when="pressAction=toggle" data-show-default="none">
      <div data-show-when="source=mqtt" data-show-default="mqtt">
        <hac-topic setting="pressStateTopic" suggest suggest-prefix="press" label="pi.press_state_topic" placeholder="pi.topic_search_placeholder" hint="pi.press_state_topic_hint"></hac-topic>
        <hac-json-field setting="pressField" topic-setting="pressStateTopic" label="pi.field"></hac-json-field>
        <hac-topic no-explore setting="pressCommandTopic" label="pi.command_topic" placeholder="pi.command_topic_placeholder"></hac-topic>
        <pi-field setting="pressOnValue" label="pi.on_value" placeholder="pi.auto_value"></pi-field>
        <pi-field setting="pressOffValue" label="pi.off_value" placeholder="pi.auto_value" hint="pi.auto_value_hint"></pi-field>
        <pi-field setting="pressTemplate" label="pi.template" placeholder='{"state":"{value}"}'></pi-field>
        <hac-test prefix="press"></hac-test>
      </div>
      <pi-color setting="pressColor" default="#F7A600" label="pi.frame_color"></pi-color>
    </div>
    <div data-show-when="pressAction=send" data-show-default="none">
      <div data-show-when="source=mqtt" data-show-default="mqtt">
        <hac-topic setting="sendTopic" label="pi.send_topic" placeholder="pi.topic_search_placeholder"></hac-topic>
        <pi-field setting="sendPayload" label="pi.send_payload" placeholder="pi.send_payload_placeholder" hint="pi.send_payload_hint"></pi-field>
      </div>
    </div>
  </pi-section>

  <pi-section class="pi-win" title="pi.advanced" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic no-explore setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></hac-topic>
  </pi-section>

  <pi-more ready-when="entityId,stateTopic" setup-hint="pi.set_up_hint"></pi-more>
  <hac-sources class="pi-pi-only"></hac-sources>

  <div id="connections" data-window-section="pi.connections" class="pi-win hac-connections">
    <hac-ha-card></hac-ha-card>
    <hac-connection-card></hac-connection-card>
  </div>

  <div class="pi-footer"><span data-plugin-version>HA-C</span></div>
</body>

</html>
