<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trigger</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="hac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden data-title="Trigger">
  <div class="pi-hint hac-help" data-i18n="pi.publish_help"></div>

  <hac-device action="publish"></hac-device>

  <pi-section class="hac-win" title="pi.send" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic setting="topic" label="pi.send_topic" placeholder="pi.topic_search_placeholder"></hac-topic>
    <pi-field setting="payload" label="pi.send_payload" placeholder="pi.send_payload_placeholder" hint="pi.send_payload_hint"></pi-field>
  </pi-section>

  <pi-section title="pi.display">
    <pi-field setting="label" label="pi.label" placeholder="pi.label_placeholder"></pi-field>
    <pi-toggle setting="hideLabel" label="pi.hide_label"></pi-toggle>
    <pi-color setting="color" default="#F7A600" label="pi.color"></pi-color>
  </pi-section>

  <pi-section title="pi.on_press">
    <pi-toggle setting="confirm" label="pi.confirm" hint="pi.confirm_hint"></pi-toggle>
  </pi-section>

  <pi-section class="hac-win" title="pi.icons">
    <pi-icon-picker setting="icon" default-icon="mdiGestureTapButton"></pi-icon-picker>
    <pi-toggle setting="colorCaption" label="pi.color_caption" hint="pi.color_caption_hint"></pi-toggle>
  </pi-section>

  <pi-section class="hac-win" title="pi.advanced" data-show-when="source=mqtt" data-show-default="mqtt">
    <hac-topic no-explore setting="availabilityTopic" label="pi.availability_topic" hint="pi.availability_topic_hint"></hac-topic>
    <pi-toggle setting="retain" label="pi.retain" hint="pi.retain_hint"></pi-toggle>
    <pi-choice setting="qos" default="0" columns="3" data-options='[
      {"value":"0","label":"QoS 0"},
      {"value":"1","label":"QoS 1"},
      {"value":"2","label":"QoS 2"}
    ]'></pi-choice>
  </pi-section>

  <hac-more class="hac-pi-only" ready-when="entityId,topic"></hac-more>
  <hac-sources class="hac-pi-only"></hac-sources>

  <div id="connections" class="hac-win hac-connections">
    <hac-ha-card></hac-ha-card>
    <hac-connection-card></hac-connection-card>
  </div>

  <div class="pi-footer"><span data-plugin-version>HA-C</span></div>
</body>

</html>
